name: Request a guide / resource
description: Ask for a new guide, tool page, or resource.
title: "[request] "
labels: ["enhancement", "good first issue"]
body:
  - type: input
    id: topic
    attributes:
      label: Topic / tool
      placeholder: "e.g. kterm setup, Tailscale, WeRead on Android"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device + firmware (if relevant)
      placeholder: "PW5 5.16.2.1.1"
  - type: textarea
    id: why
    attributes:
      label: Why is this needed?
      placeholder: "What are you trying to do, and where are you stuck?"
    validations:
      required: true
  - type: input
    id: links
    attributes:
      label: Helpful links (optional)
