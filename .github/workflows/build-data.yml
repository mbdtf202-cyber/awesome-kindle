name: Build data

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "README_EN.md"
      - "scripts/build_resources.py"
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate the machine-readable index
        run: |
          python3 scripts/build_resources.py
          python3 scripts/validate_data.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/resources.json docs/resources.json
            git commit -m "chore(data): auto-regenerate resources.json [skip ci]"
            git push
          else
            echo "No changes."
          fi
