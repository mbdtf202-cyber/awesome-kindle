name: Links

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 0 * * 1" # every Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress README.md README_EN.md CONTRIBUTING.md docs/guides/README.md docs/jailbreaks/README.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish link-health summary
        if: always()
        run: |
          if [ -f lychee/out.md ]; then cat lychee/out.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Open / update a broken-links issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'broken-links';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `The weekly/PR link check failed. See the run: ${runUrl}\n\nFix the broken links or add an exclusion in \`lychee.toml\`.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 1
            });
            if (issues.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: '🔗 Broken links detected', body, labels: [label] });
            }
