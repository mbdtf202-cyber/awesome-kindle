name: Upstream sync

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch & diff upstream jailbreaks.json
        id: sync
        run: |
          python3 scripts/sync_upstream.py
          if [ -s data/upstream/DIFF.md ]; then echo "changed=true" >> $GITHUB_OUTPUT; else echo "changed=false" >> $GITHUB_OUTPUT; fi
      - name: Commit snapshot
        run: |
          if [ -n "$(git status --porcelain data/upstream)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/upstream
            git commit -m "chore(upstream): sync jailbreaks.json [skip ci]"
            git push
          fi
      - name: Open / update an upstream-sync issue
        if: steps.sync.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('data/upstream/DIFF.md', 'utf8');
            const label = 'upstream-sync';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label, per_page: 1
            });
            if (issues.length) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issues[0].number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: '🔄 Upstream compatibility changed', body, labels: [label] });
            }
