<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Awesome Kindle — Jailbreak, Flash, Play">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111c31"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e7ecf3"/>
      <stop offset="100%" stop-color="#c8d3e0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.15" r="0.7">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.5">
    <path d="M0 40H1280M0 80H1280M0 120H1280M0 160H1280M0 200H1280M0 240H1280M0 280H1280"/>
    <path d="M40 0V320M80 0V320M120 0V320M160 0V320M200 0V320M240 0V320M280 0V320"/>
  </g>

  <!-- e-reader illustration -->
  <g transform="translate(980,56)">
    <rect x="0" y="0" width="220" height="208" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <rect x="14" y="18" width="192" height="160" rx="6" fill="url(#screen)"/>
    <rect x="26" y="32" width="120" height="6" rx="3" fill="#94a3b8"/>
    <rect x="26" y="48" width="160" height="4" rx="2" fill="#aab6c6"/>
    <rect x="26" y="60" width="150" height="4" rx="2" fill="#aab6c6"/>
    <rect x="26" y="72" width="164" height="4" rx="2" fill="#aab6c6"/>
    <rect x="26" y="84" width="110" height="4" rx="2" fill="#aab6c6"/>
    <rect x="26" y="104" width="160" height="4" rx="2" fill="#b6c1cf"/>
    <rect x="26" y="116" width="140" height="4" rx="2" fill="#b6c1cf"/>
    <rect x="26" y="128" width="156" height="4" rx="2" fill="#b6c1cf"/>
    <circle cx="110" cy="192" r="7" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <!-- penguin badge -->
    <g transform="translate(150,120)">
      <ellipse cx="0" cy="0" rx="18" ry="22" fill="#0b1220"/>
      <ellipse cx="0" cy="4" rx="11" ry="14" fill="#f8fafc"/>
      <circle cx="-6" cy="-8" r="2.2" fill="#0b1220"/>
      <circle cx="6" cy="-8" r="2.2" fill="#0b1220"/>
      <path d="M-4 3 L0 7 L4 3" stroke="#f59e0b" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- left text block -->
  <g transform="translate(72,74)">
    <rect x="0" y="0" width="188" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
    <text x="16" y="20" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" fill="#7dd3fc" letter-spacing="2">KINDLE MODDING</text>

    <text x="0" y="86" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="62" font-weight="800" fill="#f8fafc">AWESOME <tspan fill="url(#accent)">KINDLE</tspan></text>

    <text x="2" y="126" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#cbd5e1">Jailbreak · Flash · Play — the open-source index for Kindle tinkering</text>

    <g transform="translate(0,158)">
      <rect x="0" y="0" width="118" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
      <text x="18" y="20" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#a5b4fc">🔓 Jailbreak</text>
      <rect x="128" y="0" width="112" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
      <text x="146" y="20" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#67e8f9">🧱 Flashing</text>
      <rect x="250" y="0" width="150" height="30" rx="15" fill="#0f172a" stroke="#334155"/>
      <text x="268" y="20" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#f9a8d4">📚 KOReader · Apps</text>
    </g>
  </g>

  <rect x="0" y="300" width="1280" height="4" fill="url(#accent)" opacity="0.9"/>
</svg>
